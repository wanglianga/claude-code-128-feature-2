# 一键启动：PostgreSQL 15 + 义齿加工协同服务
# 使用：docker compose up -d --build
# 服务： http://localhost:8080/api/health
# 文档： http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:15
    container_name: dentallab-postgres
    environment:
      POSTGRES_DB: dentallab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentallab"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: dentallab-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dentallab
      DB_USER: postgres
      DB_PASS: postgres
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
